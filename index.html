<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр: орфограммы в корне слова</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1b2430; --muted:#5b6675; --line:#d9dee5;
  --main:#1f3a5f; --main-ink:#fff; --ok:#17633a; --okbg:#e6f2ea; --bad:#9b2c1f; --badbg:#f8e8e5;
  --hl:#c58a00; --sel:#e6ecf7;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12161c; --card:#1b222b; --ink:#e7ecf2; --muted:#a2adba; --line:#33404d;
  --main:#8fb4e8; --main-ink:#0e1a2b; --ok:#7fd3a0; --okbg:#193426; --bad:#f19a8e; --badbg:#3a1f1b;
  --hl:#e3b45c; --sel:#243348;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;font-size:17px;line-height:1.55}
.app{max-width:700px;margin:0 auto;padding:22px 16px 48px}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:12px 0 8px}
h1{font-size:1.8rem;line-height:1.2}
h2{font-size:1.3rem}
.lead{color:var(--muted);margin:0 0 20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.score{font-weight:600;color:var(--muted);font-size:.95rem}
.link{font:inherit;background:none;border:0;color:var(--main);cursor:pointer;padding:6px 0;font-weight:600}
.btn{font:inherit;font-weight:600;background:var(--main);color:var(--main-ink);border:0;border-radius:6px;padding:12px 22px;cursor:pointer;display:block;width:100%;margin-top:14px}
.btn.alt{background:transparent;color:var(--main);border:1.5px solid var(--main)}
.btn:hover{filter:brightness(1.1)}
button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.mode{font:inherit;color:var(--ink);display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 16px;margin-bottom:10px;cursor:pointer}
.mode:hover{border-color:var(--main)}
.mode b{display:block}
.mode small{color:var(--muted);font-size:.86rem}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--main);transition:width .3s}
.ask{font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;margin:6px 0 8px}
.sent{background:var(--card);border-radius:8px;padding:18px;font-size:1.25rem;line-height:1.6;margin-bottom:14px;border:1px solid var(--line)}
.sent.word{font-size:1.7rem;text-align:center;letter-spacing:.02em}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(80px,1fr))}
.opts.row .opt{text-align:center;font-size:1.3rem;font-weight:700}
.opt{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:11px 14px;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--main)}
.opt.sel{border-color:var(--main);background:var(--sel)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.miss{border:2px dashed var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;padding:12px 16px;border-radius:6px;font-size:.95rem}
.fb.ok{background:var(--okbg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:4px solid var(--bad)}
.fb div{margin:2px 0}
 .pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:12px;background:var(--card);border:1px dashed var(--line);border-radius:8px;margin-bottom:14px}
.chip{font:inherit;font-weight:600;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer}
.chip.sel{border-color:var(--main);background:var(--sel)}
.chip[draggable=true]{cursor:grab}
.sticky{position:sticky;top:0;z-index:3;background:var(--bg);padding:4px 0 8px}
.baskets2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.bk2{background:var(--card);color:var(--ink);border:2px solid var(--line);border-top:5px solid var(--main);border-radius:8px;padding:8px 10px;min-height:84px;cursor:pointer;text-align:center;user-select:none}
.bk2:hover,.bk2.armed{border-color:var(--main)}
.bk2.over{background:var(--sel)}
.bk2 b{display:block;font-size:.92rem;line-height:1.3}
.bk2 .cnt{color:var(--muted);font-size:.85rem}
.bk2 .slot{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;max-height:70px;overflow:auto}
.bk2 .slot span{background:var(--okbg);border-radius:4px;padding:0 7px;font-size:.82rem}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{font-family:Georgia,serif;font-size:2rem;font-weight:700;margin:4px 0}
.note{color:var(--muted);font-size:.9rem}
.wrong{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:10px 14px;margin-bottom:8px;font-size:.95rem}
.wrong small{display:block;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--main);border-radius:8px;padding:12px 16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.card p{margin:4px 0;font-size:.95rem}
.card .exc{color:var(--bad);font-weight:600}
.card .ex{font-style:italic;color:var(--main)}
.blk{font-family:Georgia,serif;font-size:1.15rem;margin:18px 0 8px;color:var(--main)}
@media (max-width:460px){body{font-size:16px}.opts.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ---------- справочник (по схеме «Орфограммы в корне слова») ---------- */
const REF = [
 {b:"Блок 1. Проверяемые написания", r:[
  ["Безударные гласные","Измените слово так, чтобы гласная оказалась под ударением. Если проверить нельзя, смотрите в словаре.","","извинился — повинность; поглощать — глотка; вытеснить — тесный. Словарные: вестибюль, винегрет, эстакада."],
  ["Сомнительные согласные","Измените слово так, чтобы после согласной стояла гласная. Если проверить нельзя, смотрите в словаре.","","кружка — кружечка; дерзкий — дерзость; усидчивый — сидеть. Словарные: вокзал, мундштук, ягдташ."],
  ["Непроизносимые согласные","Подберите форму, где после согласной стоит гласная или звонкая согласная.","","безмолвствовать — безмолвие; грустный — грустить; явственный — явный."]
 ]},
 {b:"Блок 2. Чередующиеся гласные: выбор зависит от следующей буквы", r:[
  ["ЛАГ — ЛОЖ","Перед Г пишется А, перед Ж — О.","Исключения: полог, слоговой.","прилагательное, полагать; сложение, положить."],
  ["РАСТ — РАЩ — РОС","Перед СТ и Щ пишется А, в остальных случаях О. Суффикс -Л- после корня — ориентир для О.","Исключения: отрасль, росток, ростовщик, Ростов, Ростислав, на вырост, подростковый.","растение, выращенный; поросль, заросли, росла, взросление."],
  ["КАС — КОС","А, если после корня есть суффикс -А-; в остальных случаях О (значение прикосновения).","","касаюсь, касание; коснусь, прикосновение."]
 ]},
 {b:"Блок 2 (продолжение). Чередующиеся гласные: выбор зависит от значения", r:[
  ["РАВН — РОВН","А — «равный, одинаковый»; О — «ровный, прямой, гладкий».","Исключения: поровну, равнина, равнение.","уравнение, приравнять, сравнить; подровнять, выровнять, уровень."],
  ["СКАК — СКОЧ","О — действие однократное; А — действие многократное.","Исключения: скачок, скакнуть.","выскочить, перескочил; ускачу, прискакать, скакалка."],
  ["МАК — МОК","О — «впитывать, пропускать жидкость»; А — «погружать в жидкость».","","смочить, вымокнуть, промокнуть; макать сухарь, обмакнуть перо."]
 ]},
 {b:"Блок 2 (продолжение). Чередующиеся гласные: выбор зависит от ударения", r:[
  ["ГАР — ГОР","В безударном положении пишется О.","Исключения: изгарь, пригарь, выгарки.","гореть, загорелый."],
  ["ТВАР — ТВОР","В безударном положении пишется О.","Исключение: утварь.","творить, вытворять, творец."],
  ["КЛАН — КЛОН","В безударном положении пишется О.","","склониться, поклоняться."],
  ["ЗАР — ЗОР","В безударном положении пишется А.","","заря, озарение."],
  ["ПЛАВ — ПЛОВ","Пишется А. О только в словах пловец и пловчиха.","","поплавок, плавники, плавучий."]
 ]},
 {b:"Блок 2 (продолжение). Чередование Е — И", r:[
  ["БЕР-БИР, МЕР-МИР, ТЕР-ТИР, ДЕР-ДИР, ПЕР-ПИР, ЖЕГ-ЖИГ, СТЕЛ-СТИЛ, БЛЕСТ-БЛИСТ, ЧЕТ-ЧИТ","И, если после корня есть суффикс -А-; в остальных случаях Е. Корень МЕР-МИР чередуется только в словах со значением «смерть».","Исключения: сочетать, сочетание.","замирать, вытирать, придираться; замерли, вытер, блестеть."],
  ["А(Я) — ИМ, А(Я) — ИН","ИМ, ИН пишутся, если за корнем следует суффикс -А-.","","занять — занимать; обнять — обнимать; начать — начинать."]
 ]},
 {b:"Блок 3. Гласные после шипящих", r:[
  ["Ё или О после шипящих","Ё, если можно подобрать однокоренное слово с Е. В остальных случаях О.","","чёрный — чернеть; шёпот — шептать; щёголь — щеголять. Но: крыжовник, крюшон, мажор, обжора."],
  ["ЖИ-ШИ, ЧА-ЩА, ЧУ-ЩУ","Пишется И, А, У.","Исключения: жюри, брошюра, парашют.","жир, чаща, щука."]
 ]}
];

/* ---------- ряды из тренинга №1 [номер, буква, слова: [слово, верная буква, пояснение]] ---------- */
const G = [
 [1,"А",[["скомп_новать","О","Словарное слово."],["выт_чка на платье","А","Проверка: выта́чивать."],["пром_кнуть написанное","О","Чередующийся корень МАК-МОК, не проверяется: О в значении «впитывать жидкость»."],["пл_вучесть судна","А","Чередующийся корень ПЛАВ-ПЛОВ, не проверяется: пишется А (О только в словах пловец, пловчиха)."],["кошка ок_тилась","О","Проверка: кот."]]],
 [2,"И",[["т_сненая кожа","И","Проверка: ти́снуть."],["ч_столюбивый","Е","Проверка: честь."],["прод_рёшься","Е","Чередующийся корень ДЕР-ДИР, не проверяется: суффикса -А- нет, поэтому Е."],["бл_стательный","И","Чередующийся корень БЛЕСТ-БЛИСТ, не проверяется: суффикс -А- (блистать), поэтому И."],["поч_татель таланта","И","Чередующийся корень ЧЕТ-ЧИТ, не проверяется: суффикс -А- (почитать), поэтому И."]]],
 [3,"Е",[["разр_женный воздух","Е","Проверка: ре́дкий."],["нащ_пать лучину","Е","Проверка: ще́пка."],["супружеская ч_та","Е","Чередующийся корень ЧЕТ-ЧИТ, не проверяется: суффикса -А- нет (-а на конце — окончание), поэтому Е."],["б_чевать пороки","И","Проверка: бич."],["д_виденды","И","Словарное слово."]]],
 [4,"Я",[["просв_щение","Е","Проверка: свет."],["прист_жной конь","Я","Словарное слово."],["прор_дить всходы","Е","Проверка: ре́дкий."],["ум_нать землю","И","Чередующийся корень (умять — уминать), не проверяется: перед суффиксом -А- пишется И."],["см_тение","Я","Чередующийся корень (смять — сминать), не проверяется: суффикса -А- нет, поэтому Я."]]],
 [5,"А",[["п_лисадник","А","Словарное слово."],["об_няние","О","Словарное слово."],["заск_чи на часок","О","Чередующийся корень СКАК-СКОЧ, не проверяется: О при однократном действии."],["р_внина","А","Чередующийся корень РАВН-РОВН, не проверяется: исключение — равнина (А)."]]],
 [6,"Е",[["ч_стоплотный","И","Проверка: чи́сто."],["б_чевать баржу","Е","Словарное слово."],["прид_решься","Е","Чередующийся корень ДЕР-ДИР, не проверяется: суффикса -А- нет, поэтому Е."],["соч_тание красок","Е","Чередующийся корень ЧЕТ-ЧИТ, не проверяется: исключение — сочетание (Е)."]]],
 [7,"И",[["прис_дать","Е","Проверка: присе́сть."],["в_нтилятор","Е","Словарное слово."],["ст_пендия","И","Словарное слово."],["экстр_мальный","Е","Словарное слово."],["песс_мист","И","Словарное слово."]]],
 [8,"О",[["утр_мбовать","А","Словарное слово."],["пор_вняться","А","Чередующийся корень РАВН-РОВН, не проверяется: А в значении «равный, одинаковый»."],["местный ст_рожил","А","Проверка: ста́рый."],["ал_гичный","О","Проверка: ло́гика."]]],
 [9,"Е",[["б_чёвка","Е","Словарное слово."],["дети разв_ваются","И","Проверка: разви́ть."],["чинопоч_тание","И","Чередующийся корень ЧЕТ-ЧИТ, не проверяется: суффикс -А- (почитать), поэтому И."],["ижд_вение","Е","Словарное слово."],["сувер_нитет","Е","Словарное слово."]]],
 [10,"А",[["к_сатка плавает","О","Словарное слово."],["сп_ртакиада","А","Словарное слово."],["благосл_вить","О","Проверка: сло́во."],["нав_ждение","А","Словарное слово."],["доск_нально","О","Словарное слово."]]],
 [11,"О",[["предв_рительно","А","Словарное слово."],["ум_лять значение","А","Проверка: ма́лый."],["аккомп_немент","А","Словарное слово."],["об_яние","А","Словарное слово."]]],
 [12,"И",[["прив_легия","И","Словарное слово."],["вин_грет","Е","Словарное слово."],["ц_ганский","Ы","Исключение: цыганский."],["запом_нать","И","Чередующийся корень (запомнить — запоминать), не проверяется: перед суффиксом -А- пишется И."],["поб_рушка","И","Чередующийся корень БЕР-БИР, не проверяется: слово от побираться (суффикс -А-), поэтому И."]]],
 [13,"А",[["к_нитель","А","Словарное слово."],["к_рдинальный","А","Словарное слово."],["г_ревой дым","А","Чередующийся корень ГАР-ГОР, не проверяется: слово образовано от гарь, как исключения изгарь, пригарь, выгарки."],["р_вняйсь","А","Чередующийся корень РАВН-РОВН, не проверяется: в команде «равняйсь» пишется А."]]],
 [14,"Е",[["антр_соли","Е","Словарное слово."],["бадм_нтон","И","Словарное слово."],["верм_шель","И","Словарное слово."],["поч_тать старших","И","Чередующийся корень ЧЕТ-ЧИТ, не проверяется: суффикс -А- (почитать), поэтому И."],["прив_дение на крыше","И","Проверка: ви́деть."]]],
 [15,"И",[["панц_рь","И","Словарное слово."],["ц_гейка","И","Словарное слово."],["упом_нуть","Я","Чередующийся корень (упомянуть — упоминать), не проверяется: суффикса -А- нет, поэтому Я."],["пос_дел на лавке","И","Проверка: сидя."],["рез_денция","И","Словарное слово."]]]
];
const fill = (w,l) => w.replace("_", l.toLowerCase());

/* режим 1: вставьте букву */
const FAM = l => "АО".includes(l) ? ["А","О"] : l === "Ы" ? ["Ы","И"] : l === "Я" ? ["Е","И","Я"] : ["Е","И"];
const EXTRA = [
 ["укр_титель","О","Проверка: кро́ткий."],
 ["ув_дающий","Я","Проверка: вя́нуть."],
 ["обр_мление","А","Проверка: ра́ма."]
];
const LETTERS = [...G.flatMap(g => g[2].filter(w => !"ЯЁ".includes(w[1]))), ...EXTRA].map(([w,l,x]) => ({
  s:w, word:true, o:FAM(l), row:true, a:l, e:fill(w,l)+" — "+l+". "+x
}));

/* режим 2: ряды (несколько ответов, возможен ответ «таких слов нет») */
const ROWS = G.map(([n,L,ws]) => ({
  s:"Ряд №"+n+". Найдите слова, в которых на месте пропуска пишется буква "+L+".",
  o:ws.map(w=>w[0]), a:ws.filter(w=>w[1]===L).map(w=>w[0]), multi:true, none:true, keep:true,
  e:ws.map((w,i)=>"<b>"+(i+1)+") "+fill(w[0],w[1])+"</b> — "+w[1]+". "+w[2]).join("|")
}));

/* режим 3: корни с чередованием / без чередования */
const BA = "Корень с чередованием", BN = "Корень без чередования";
const ALT = {
 "ЛАГ-ЛОЖ":["прилагательное","полагать","слагаемое","предлагать","излагать","сложение","положить","предложение","изложение","выложить"],
 "РАСТ-РАЩ-РОС":["растение","выращенный","поросль","заросли","растущий","взросление","сращение","прирастать"],
 "КАС-КОС":["касание","прикосновение","коснуться","прикасаться"],
 "РАВН-РОВН":["уравнение","подровнять","выровнять","приравнять","сравнить"],
 "СКАК-СКОЧ":["скакалка","выскочить","перескочить","прискакать"],
 "МАК-МОК":["обмакнуть","вымокнуть","смочить","промокашка"],
 "ГАР-ГОР":["загорелый","выгорать","горение","загореть"],
 "ТВАР-ТВОР":["творить","творящий","творец","вытворять","сотворить"],
 "КЛАН-КЛОН":["поклониться","склонение","поклоняться","наклонять"],
 "ЗАР-ЗОР":["заря","озарение","озарить","озарять"],
 "ПЛАВ-ПЛОВ":["плавучий","поплавок","пловец","плавник"],
 "БЕР-БИР":["собирать","избирать","соберу","выбирать"],
 "ДЕР-ДИР":["раздирать","задирать","сдеру","раздеру"],
 "МЕР-МИР":["умирать","замереть","вымирать","умереть"],
 "ПЕР-ПИР":["запирать","запереть","отпирать","подпереть"],
 "ТЕР-ТИР":["стирать","вытереть","растирать","протереть"],
 "БЛЕСТ-БЛИСТ":["блестеть","блистать","блистательный","блестящий"],

const ALTQ = "Есть ли в слове чередующийся корень?";
function altItem(w, isAlt, e){ return {s:w, word:true, o:[BA,BN], keep:true, a:isAlt ? BA : BN, e, ask:ALTQ, m:{ask:ALTQ}}; }
function playAlt(){
  const yes = Object.entries(ALT).flatMap(([r,ws]) => ws.map(w => altItem(w, true, "«"+w+"» — чередующийся корень "+r+".")));
  const no = NOALT.map(([w,n]) => altItem(w, false, "«"+w+"» — "+n+"."));
  const items = shuffle([...shuffle(yes).slice(0,12), ...shuffle(no).slice(0,12)]);
  clear();
  const tries = {}, chips = {}, byWord = {}, wrong = [], boxes = {};
  let ok = 0, left = items.length, picked = null;
  const tb = topbar("Верно с первой попытки: 0 из "+items.length, home);
  const status = h("div","fb"), row = h("div","baskets2"), wrap = h("div","sticky"), pool = h("div","pool");
  const hint = "Выберите слово, затем нажмите на корзину (или перетащите слово в корзину).";
  const setStatus = (cls,t) => { status.className = "fb"+(cls ? " "+cls : ""); status.style.marginTop = "0"; status.textContent = t; };
  setStatus("", hint);
  function select(it){
    if(picked) chips[picked.s].classList.remove("sel");
    picked = (picked && picked.s === it.s) ? null : it;
    if(picked){ chips[it.s].classList.add("sel"); setStatus("","Выбрано: «"+it.s+"». Теперь нажмите на корзину."); }
    else setStatus("", hint);
    [...row.children].forEach(x=>x.classList.toggle("armed", !!picked));
  }
  function drop(it, name){
    if(!it){ setStatus("bad","Сначала выберите слово."); return; }
    if(picked) chips[picked.s].classList.remove("sel");
    picked = null;
    [...row.children].forEach(x=>x.classList.remove("armed"));
    if(it.a === name){
      const bx = boxes[name];
      bx.slot.append(h("span","",it.s)); bx.n++; bx.cnt.textContent = bx.n+" шт.";
      chips[it.s].remove();
      if(!tries[it.s]) ok++;
      tb.score.textContent = "Верно с первой попытки: "+ok+" из "+items.length;
      setStatus("ok","Верно. "+it.e);
      if(--left === 0) app.append(btn("Показать результат", ()=>results(items, wrong, ok, "Найдите корни с чередованием")));
    } else {
      if(!tries[it.s]){ tries[it.s] = 1; wrong.push(it); }
      const el = boxes[name].el;
      el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
      setStatus("bad","Неверно. "+it.e);
    }
  }
  items.forEach(it=>{
    const c = h("button","chip",it.s);
    c.type = "button"; c.draggable = true;
    c.onclick = () => select(it);
    c.ondragstart = e => { e.dataTransfer.setData("text/plain", it.s); };
    chips[it.s] = c; byWord[it.s] = it; pool.append(c);
  });
  [BA,BN].forEach(name=>{
    const el = h("div","bk2"), slot = h("div","slot"), cnt = h("div","cnt","0 шт.");
    el.setAttribute("role","button"); el.tabIndex = 0;
    el.append(h("b","",name), cnt, slot);
    boxes[name] = {el, slot, cnt, n:0};
    el.onclick = () => drop(picked, name);
    el.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); drop(picked, name); } };
    el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
    el.ondragleave = () => el.classList.remove("over");
    el.ondrop = e => { e.preventDefault(); el.classList.remove("over"); drop(byWord[e.dataTransfer.getData("text/plain")], name); };
    row.append(el);
  });
  wrap.append(status, row);
  app.append(tb.el, wrap, h("p","ask","Слова для распределения"), pool);
}

function run(items, title){
  const list = shuffle(items.slice());
  let i = 0, ok = 0; const wrong = [];
  (function step(){
    clear();
    const it = list[i], m = it.m;
    const tb = topbar("Верно: "+ok+" · "+(i+1)+"/"+list.length, home);
    app.append(tb.el, progress(i, list.length), h("p","ask", it.ask || m.ask || "Выберите ответ"));
    app.append(h("div","sent"+(it.word ? " word" : ""),it.s));
    if(it.multi) app.append(h("p","note","Можно выбрать несколько слов. Если подходящих слов нет, нажмите «Таких слов нет»."));
    const optList = it.keep ? it.o.slice() : shuffle(it.o.slice());
    const g = h("div","opts"+(it.row ? " row" : "")+(!it.keep && !it.row && optList.length > 4 ? " two" : "")), fb = h("div","fb");
    fb.style.display = "none";
    const chosen = new Set(), buttons = [];
    let ctrl = [];
    function finish(right){
      ctrl.forEach(b=>b.remove());
      buttons.forEach(b=>{
        b.disabled = true;
        const t = b._t, isA = it.multi ? it.a.includes(t) : t === it.a;
        if(isA) b.classList.add(chosen.has(t) ? "ok" : "miss");
        else if(chosen.has(t)) b.classList.add("bad");
      });
      if(right) ok++; else wrong.push(it);
      tb.score.textContent = "Верно: "+ok+" · "+(i+1)+"/"+list.length;
      fb.className = "fb "+(right ? "ok" : "bad"); fb.style.display = "block";
      fb.innerHTML = "";
      fb.append(h("div","", right ? "Верно." : "Неверно. Правильный ответ: "+ansText(it.a)+"."));
      it.e.split("|").forEach(line=>{
        const d = h("div"), mt = line.match(/^<b>(.*?)<\/b>(.*)$/);
        if(mt){ d.append(h("b","",mt[1]), document.createTextNode(mt[2])); } else d.textContent = line;
        fb.append(d);
      });
      const last = i === list.length-1;
      app.append(btn(last ? "Показать результат" : "Далее", ()=>{ if(last) results(list, wrong, ok, title); else { i++; step(); } }));
    }
    optList.forEach(o=>{
      const b = h("button","opt",o);
      b._t = o; buttons.push(b);
      b.onclick = () => {
        if(it.multi){ if(chosen.has(o)){ chosen.delete(o); b.classList.remove("sel"); } else { chosen.add(o); b.classList.add("sel"); } }
        else { chosen.add(o); finish(o === it.a); }
      };
      g.append(b);
    });
    app.append(g, fb);
    if(it.multi){
      const check = btn("Проверить", ()=>{
        if(!chosen.size) return;
        finish(chosen.size === it.a.length && it.a.every(x=>chosen.has(x)));
      });
      ctrl = [check];
      app.append(check);
      if(it.none){
        const none = btn("Таких слов нет", ()=>{ chosen.clear(); finish(it.a.length === 0); }, true);
        ctrl.push(none); app.append(none);
      }
    }
  })();
}

function results(list, wrong, ok, title){
  clear();
  const pct = Math.round(ok/list.length*100);
  app.append(h("h2","",title), h("p","big",ok+" из "+list.length),
    h("p","", pct >= 90 ? "Отличный результат ("+pct+"%)" : pct >= 70 ? "Хороший результат ("+pct+"%)" : pct >= 50 ? "Базовый уровень ("+pct+"%)" : "Нужно повторить ("+pct+"%)"));
  if(wrong.length){
    app.append(h("h2","","Ошибки"));
    wrong.forEach(it=>{
      const d = h("div","wrong", it.s); d.append(h("small","","Верно: "+ansText(it.a)+". "+plainE(it.e))); app.append(d);
    });
    app.append(btn("Повторить ошибки ("+wrong.length+")", ()=>run(wrong, "Работа над ошибками")));
  }
  app.append(btn("Пройти ещё раз", ()=>run(list, title), true), btn("В меню", home, true));
}

home();
</script>
</body>
</html>
